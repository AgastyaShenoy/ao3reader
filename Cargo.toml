[package]
name = "ao3reader"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = "0.33.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["cookies", "json", "form"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
rfd = "0.15"
url = "2.5.8"
webbrowser = "1.2.4"
